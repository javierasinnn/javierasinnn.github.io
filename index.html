<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensaje</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a2741 0%, #080d18 65%, #03050a 100%);
      color: #f4f8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .mensaje {
      margin: 0;
      padding: 1rem;
      max-width: 100%;
      text-align: center;
      font-size: clamp(2.1rem, 10vw, 10rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.25;
      text-shadow: 0 0 0.4em #9abfff, 0 0 1.1em #437ed8;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <p class="mensaje">.. / .-.. --- ...- . / ..-</p>
</body>
</html>
